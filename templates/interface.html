<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado de Ferramentas</title>
    <link rel="stylesheet" href="../static/estilos/style.css">
</head>
<body>

    <header style="position: relative; width: 100%; height: 60px;">
        <div class="user-login" onclick="toggleMenu()">
            <div class="user-icon">
                <img src="../static/Imagens/user-avatar.png" alt="Usuario">
            </div>
            <div class="user-info">
                <span class="user-name">Felipe Silva</span>
                <span class="seta">▼</span>
            </div>

            <div id="menuOpcoes" class="dropdown-content">
                <a href="#">Alterar Usuário</a>
                <a href="#">Máquinas</a>
                <a href="#">Acrescentar Ferramentas</a>
            </div>
        </div>
    </header>

   

    <div class="id-card">
        
        <header class="card-header">
            <div class="header-left">
                <div class="logo-icon"><img class="logo-icon" src="../static/Imagens/logo-A.png"></div> <!-- imagem da logo A-->
                <h1 class="header-title">Almoxarifado de Ferramentas</h1>
            </div>
            <div class="header-right">
                <img class="logo-andritz" src="../static/Imagens/Andritz_Logo.svg.png"> <!-- imagem da logo ANDRITZ-->
            </div>
            
            

        </header>

        <main class="card-body">
            <div class="watermark-bg">ANDRITZ</div>

            <div class="scan-card">
                <h3 class="scan-title">Escaneie para Acessar o Inventário</h3>
                
                <div class="scan-instruction">
                    <span class="phone-icon">📱</span> 
                    <p>Aponte a câmera do seu celular</p>
                </div>

                <div class="qr-wrapper">
                    <a href="Segunda_tela.html">
                        <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=AcessoInventario&color=004b87">
                    </a>
                </div>
            </div>
        </main>

        <footer class="card-footer">
            <p>Sistema de Gestão de Ferramentas &copy; 2026</p>
        </footer>

    </div>
<script>
    function toggleMenu() {
        const menu = document.getElementById("menuOpcoes");
        menu.classList.toggle("show");
    }

    // Fecha o menu se o usuário clicar fora dele
    window.onclick = function(event) {
        if (!event.target.closest('.user-login')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
        }
    }
}
</script>

</body>
</html>
