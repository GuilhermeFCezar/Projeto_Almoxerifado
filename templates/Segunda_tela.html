<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ferrementas</title>
    <link rel="stylesheet" href="../static/estilos/style.css">
</head>
<body>

   <header class="navbar">
        <div class="logo">ANDRITZ</div>
        <h1 class="nav-title"> Almoxerifado de Ferramentas</h1>
      
    </header>

    <main class="container">
        <section class="card" style="align-items: center;">
            <div class="card-header">
                <span>🔧</span> Ferramenta Lida
            </div>
            <div class="card-body">
                <h3>{{ ferramenta[1] }}</h3>
                <p style="color: #668;">ID: {{ ferramenta[0] }}</p>
                
                <img src="{{ url_for('static', filename='Imagens/' + ferramenta[3]) }}" 
                    alt="{{ ferramenta[1] }}" 
                    style="width: 150px; height: 150px; object-fit: contain; margin-top: 15px;">
                    
                <p style="margin-top: 10px; font-weight: bold; color: #004a99;">
                    Estoque Atual: {{ ferramenta[2] }}
                </p>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <span>👤</span> Registro Operador
            </div>
            <div class="card-body">
                <label for="operador">Selecione o Operador:</label>
                    <select id="operador" name="operador" class="input-field">
                    <option value="" disabled selected>Escolha um operador:</option>
                    <option value="felipe">Felipe</option>
                    <option value="guilherme">Guilherme</option>
                </select>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <span>⚙️</span> Máquinas
            </div>
            <div class="card-body">
                <div class="card-body">
                <label for="maquina">Maquinas:</label>
                    <select id="maquina" name="maquina" class="input-field">
                    <option value="" disabled selected>Selecione a maquina:</option>
                    <option value="Skoda 45403">Skoda 45403</option>
                    <option value="Skoda 45404">Skoda 45404</option>
                    <option value="Skoda 45405">Skoda 45405</option>
                </select>
            </div>
            
        </section>

        <section class="card">
            <div class="card-header">
                <span>🔢</span> Digitar quantidade
            </div>
            <div class="card-body">
                <input type="number" id="inputNumero" placeholder="Digite um número..." class="input-field">
                <button type="button" class="btn-verificar" onclick="validarNumero()">Confirmar</button>
                <div id="mensagemAviso"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        ANDRITZ. All rights reserved | Version 1.00
    </footer>

    <div class="voltar">
    <a href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='Imagens/voltar.png') }}" alt="voltar">
    </a>
</div>

    </div>

    

<script>
    function validarNumero() {
        const input = document.getElementById('inputNumero');
        const aviso = document.getElementById('mensagemAviso');
        const valor = parseInt(input.value);
        const estoqueDisponivel = {{ ferramenta[2] }};

        if (isNaN(valor) || valor <= 0) {
            aviso.innerText = "Por favor, digite uma quantidade válida (maior que zero).";
            aviso.style.color = "orange";
        } 
        // 2. Verifica se o usuário pediu mais do que tem no banco de dados
        else if (valor > estoqueDisponivel) {
            aviso.innerText = "Quantidade indisponível! O estoque atual é de apenas " + estoqueDisponivel + " unidades.";
            aviso.style.color = "red";
        } 
        // 3. Se passou pelas regras acima, a quantidade é válida!
        else {
            aviso.innerText = "Quantidade válida! Retirada autorizada.";
            aviso.style.color = "green";
        }
    }
</script>

</body>
</html>
